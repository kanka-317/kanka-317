name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: kanka-317
          outputs: |
            output/github-snake.svg?palette=github
            output/github-snake-dark.svg?palette=github-dark

      - name: Commit generated files
        uses: EndBug/add-and-commit@v9
        with:
          message: "generated GitHub contribution snake"
          add: "output/*.svg"
